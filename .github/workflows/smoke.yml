name: Smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLC_VERSION: develop

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Build solc-bench
        run: nix build .

      - name: Fetch solc
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nix run . -- fetch "$SOLC_VERSION" --output ./solc-smoke
          ./solc-smoke --version

      - name: Run smoke tests
        env:
          SOLC: ${{ github.workspace }}/solc-smoke
        run: |
          nix shell . --inputs-from . nixpkgs#python3Packages.pytest \
            --command pytest -v tests/test_smoke.py
